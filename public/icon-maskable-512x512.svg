<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0e1018"/>
      <stop offset="100%" style="stop-color:#07080f"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f43f5e"/>
      <stop offset="100%" style="stop-color:#8b5cf6"/>
    </linearGradient>
  </defs>
  <!-- Maskable icon needs safe zone (80% center area) -->
  <rect width="512" height="512" fill="url(#bg)"/>
  <text x="256" y="225" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="68" font-weight="800" fill="url(#accent)">Ani</text>
  <text x="256" y="320" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="68" font-weight="800" fill="#f1f5f9">Noir</text>
  <rect x="156" y="345" width="200" height="5" rx="2.5" fill="url(#accent)" opacity="0.6"/>
</svg>
